name: Auto Bump Service Worker Version

# Jalan otomatis setiap ada push ke branch main,
# KECUALI kalau yang berubah cuma workflow ini sendiri (biar tidak infinite loop)
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/auto-bump-sw.yml'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version dari timestamp + hash commit
        id: version
        run: |
          NEW_VERSION="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "value=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update APP_VERSION di sw.js
        run: |
          sed -i "s/const APP_VERSION = '.*';/const APP_VERSION = '${{ steps.version.outputs.value }}';/" sw.js
          cat sw.js | head -n 6

      - name: Commit & push perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git diff --cached --quiet && echo "Tidak ada perubahan" || git commit -m "chore: auto-bump sw version [skip ci]"
          git push
