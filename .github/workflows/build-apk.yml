name: Build APK Android

# Cara pakai: tab Actions -> "Build APK Android" -> Run workflow.
# Hasilnya: file MoneyPri.apk di halaman Releases repo ini.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Alamat web MoneyPri (kosongkan = otomatis https://NAMA.github.io/REPO/)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tentukan alamat web
        id: url
        env:
          INPUT_URL: ${{ github.event.inputs.site_url }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          URL="$INPUT_URL"
          if [ -z "$URL" ]; then
            O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            R=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
            if [ "$R" = "$O.github.io" ]; then URL="https://$O.github.io/"; else URL="https://$O.github.io/$REPO/"; fi
          fi
          case "$URL" in */) ;; *) URL="$URL/" ;; esac
          echo "Alamat web: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Pasang Capacitor
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Buat proyek Android
        env:
          SITE_URL: ${{ steps.url.outputs.url }}
        run: |
          mkdir -p www
          cat > www/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyPri</title></head>
          <body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:#0D9488;color:#fff">MoneyPri</body></html>
          HTML
          node -e '
            const fs = require("fs");
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.moneypri.app",
              appName: "MoneyPri",
              webDir: "www",
              server: { url: process.env.SITE_URL, androidScheme: "https", cleartext: false }
            }, null, 2));
          '
          npx cap add android

      - name: Plugin pembuka aplikasi bank dan e-wallet
        run: |
          D=android/app/src/main/java/com/moneypri/app
          mkdir -p "$D"
          cat > "$D/AppOpenerPlugin.java" <<'JAVA'
          package com.moneypri.app;

          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AppOpener")
          public class AppOpenerPlugin extends Plugin {

              @PluginMethod
              public void open(PluginCall call) {
                  String pkg = call.getString("package");
                  if (pkg == null || pkg.trim().isEmpty()) {
                      call.reject("package kosong");
                      return;
                  }
                  JSObject ret = new JSObject();
                  try {
                      Intent launch = getContext().getPackageManager().getLaunchIntentForPackage(pkg);
                      if (launch != null) {
                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(launch);
                          ret.put("opened", true);
                          call.resolve(ret);
                          return;
                      }
                  } catch (Exception ignored) {
                  }
                  // belum terpasang -> halaman Google Play
                  try {
                      Intent store = new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + pkg));
                      store.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(store);
                  } catch (ActivityNotFoundException e) {
                      Intent web = new Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=" + pkg));
                      web.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(web);
                  }
                  ret.put("opened", false);
                  call.resolve(ret);
              }
          }
          JAVA
          cat > "$D/FileSaverPlugin.java" <<'JAVA'
          package com.moneypri.app;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "FileSaver")
          public class FileSaverPlugin extends Plugin {

              @PluginMethod
              public void save(PluginCall call) {
                  String name = call.getString("name");
                  String data = call.getString("data");
                  String mime = call.getString("mime", "application/json");
                  if (name == null || name.trim().isEmpty() || data == null) {
                      call.reject("nama atau isi file kosong");
                      return;
                  }
                  name = name.replaceAll("[^A-Za-z0-9._-]", "_");
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      call.reject("Android lama: gunakan menu bagikan");
                      return;
                  }
                  try {
                      ContentResolver resolver = getContext().getContentResolver();
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri == null) {
                          call.reject("gagal membuat file");
                          return;
                      }
                      OutputStream os = resolver.openOutputStream(uri);
                      if (os == null) {
                          call.reject("gagal membuka file");
                          return;
                      }
                      try {
                          os.write(data.getBytes("UTF-8"));
                          os.flush();
                      } finally {
                          os.close();
                      }
                      JSObject ret = new JSObject();
                      ret.put("path", "Download/" + name);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("gagal menyimpan: " + e.getMessage());
                  }
              }
          }
          JAVA
          cat > "$D/MainActivity.java" <<'JAVA'
          package com.moneypri.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AppOpenerPlugin.class);
                  registerPlugin(FileSaverPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Manifest, ikon, dan warna
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          import re, os, shutil
          # 1) izinkan aplikasi melihat paket bank/e-wallet (wajib di Android 11+)
          static = ["id.co.bankbkemobile.digitalbank","com.krom.android","com.bnc.finance","com.gojek.gopay","ovo.id",
                    "com.bca","src.com.bni","id.co.bri.brimo","id.bmri.livin","com.jago.digitalBanking","id.dana","com.shopee.id"]
          try:
              found = re.findall(r"pkg:\s*'([^']+)'", open("app.js", encoding="utf-8").read())
          except Exception:
              found = []
          pk = sorted(set(static + found))
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          q = "<queries>" + "".join('<package android:name="%s"/>' % x for x in pk) + "</queries>\n    "
          assert "<application" in s
          s = s.replace("<application", q + "<application", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("queries:", len(pk), "paket")
          # 2) ikon dari icons/icon-512.png
          from PIL import Image
          res = "android/app/src/main/res"
          src = Image.open("icons/icon-512.png").convert("RGBA")
          for d, sz in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              folder = "%s/mipmap-%s" % (res, d)
              os.makedirs(folder, exist_ok=True)
              im = src.resize((sz, sz), Image.LANCZOS)
              im.save(folder + "/ic_launcher.png")
              im.save(folder + "/ic_launcher_round.png")
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
          PY
          # 3) warna status bar sama dengan tema aplikasi, dan hindari tampilan menembus status bar
          C=android/app/src/main/res/values/colors.xml
          [ -f "$C" ] && sed -i 's/#3F51B5/#0D9488/g; s/#303F9F/#0D9488/g' "$C" || true
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 34/' android/variables.gradle || true

