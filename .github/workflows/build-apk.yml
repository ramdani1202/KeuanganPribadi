      - name: Bangun APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Siapkan file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MoneyPri.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MoneyPri APK #${{ github.run_number }}
          body: "Unduh MoneyPri.apk di bawah ini, lalu pasang di HP Android."
          files: MoneyPri.apk
