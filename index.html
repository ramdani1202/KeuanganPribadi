<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2B2620">
<meta name="description" content="Catatan Uang — pembukuan pribadi sederhana">
<title>Catatan Uang</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<link rel="stylesheet" href="styles.css">

<!-- React (versi produksi) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel standalone: mengompilasi JSX langsung di browser, jadi tidak perlu npm build -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
<!-- jsPDF untuk cetak struk -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Semua komponen di-load sebagai JSX, dikompilasi Babel saat runtime -->
<script type="text/babel" data-presets="react" src="src/utils.js"></script>
<script type="text/babel" data-presets="react" src="src/AppContext.js"></script>
<script type="text/babel" data-presets="react" src="src/Icons.js"></script>
<script type="text/babel" data-presets="react" src="src/components.js"></script>
<script type="text/babel" data-presets="react" src="src/pages.js"></script>
<script type="text/babel" data-presets="react" src="src/App.js"></script>
<script type="text/babel" data-presets="react" src="src/main.js"></script>

<script>
/* =========================================================
   AUTO-UPDATE SERVICE WORKER
   Begitu ada versi baru ter-deploy (APP_VERSION di sw.js dinaikkan),
   app mendeteksinya sendiri, download di background, lalu reload
   otomatis — tanpa user perlu clear cache/data Chrome manual.
   ========================================================= */
let swRegistration = null;
let updateReloadTriggered = false;

function activateNewServiceWorker(worker) {
  worker.postMessage('SKIP_WAITING');
}

function checkForUpdate() {
  if (swRegistration) swRegistration.update().catch(() => {});
}
// Dipanggil dari tombol ↻ manual di halaman login
window._cuCheckUpdate = checkForUpdate;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      swRegistration = reg;

      if (reg.waiting) activateNewServiceWorker(reg.waiting);

      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            activateNewServiceWorker(newWorker);
          }
        });
      });
    }).catch(() => {});

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (updateReloadTriggered) return;
      updateReloadTriggered = true;
      setTimeout(() => window.location.reload(), 400);
    });
  });

  // Cek update tiap kali app dibuka lagi / tab aktif kembali
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate();
  });
  window.addEventListener('focus', checkForUpdate);
  window.addEventListener('pageshow', checkForUpdate);
}
</script>
</body>
</html>
